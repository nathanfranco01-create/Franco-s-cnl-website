<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Franco's CNL Construction</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
body {
  font-family: Arial;
  background: #0b0d12;
  color: white;
  margin: 0;
}

.container {
  width: 90%;
  max-width: 900px;
  margin: auto;
  padding: 40px 0;
}

h1 {
  font-size: 42px;
}

form {
  display: grid;
  gap: 15px;
  margin-top: 20px;
}

input, textarea, select {
  padding: 12px;
  border-radius: 8px;
  border: none;
}

button {
  padding: 14px;
  background: #c0392b;
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
  <h1>Get a Free Quote</h1>

  <form id="contact-form">

    <input type="text" name="first" placeholder="First Name" required>
    <input type="text" name="last" placeholder="Last Name" required>

    <input type="tel" name="phone" placeholder="Phone Number" required>
    <input type="email" name="email" placeholder="Email" required>

    <select name="service" required>
      <option value="">Select Service</option>
      <option>Remodel</option>
      <option>Kitchen/Bath</option>
      <option>Roofing</option>
      <option>Framing</option>
    </select>

    <input type="text" name="address" placeholder="Project Address">

    <textarea name="message" placeholder="Tell us about your project"></textarea>

    <button type="submit">Send Request</button>

  </form>
</div>

<script>
const EMAILJS_PUBLIC_KEY = 'YlQgC-S1KavssfMku';
const EMAILJS_SERVICE_ID = 'service_2h2w1fa';
const EMAILJS_TEMPLATE_ID = 'template_3g2jvOI';

emailjs.init({
  publicKey: EMAILJS_PUBLIC_KEY
});

const form = document.getElementById('contact-form');

form.addEventListener('submit', function(e) {
  e.preventDefault();

  const btn = form.querySelector('button');
  btn.innerText = "Sending...";
  btn.disabled = true;

  emailjs.sendForm(
    EMAILJS_SERVICE_ID,
    EMAILJS_TEMPLATE_ID,
    '#contact-form'
  ).then(() => {

    alert("Request sent successfully!");
    form.reset();

    btn.innerText = "Send Request";
    btn.disabled = false;

  }).catch((err) => {

    console.error(err);
    alert("Error sending. Call instead.");

    btn.innerText = "Send Request";
    btn.disabled = false;
  });
});
</script>

</body>
</html>
